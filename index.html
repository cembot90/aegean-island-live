<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ägäis Friedensspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --gr:#2f7bff; --tr:#ff3b3b; --panel:rgba(4,22,38,.66); --sh:0 2px 6px rgba(0,0,0,.6); --gold:#ffd54a; --bi:0px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#06263d; font-family:Inter,system-ui,sans-serif; color:#fff; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }

  .av { display:inline-flex; align-items:center; justify-content:center; flex:none; border-radius:50%; overflow:hidden; font-weight:900; color:#fff; border:2px solid var(--c,#fff); background:var(--c,#555); vertical-align:middle; }
  .av img { width:100%; height:100%; object-fit:cover; display:block; }
  .av.hero { background:radial-gradient(circle at 35% 30%, #fff6c8, var(--h) 55%, #6b4a00); border-color:var(--gold); color:#2a1a00; box-shadow:0 0 10px var(--h); }

  .lbl { position:absolute; transform:translate(-50%,-100%); text-align:center; text-shadow:var(--sh); white-space:nowrap; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .lbl .n { font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .lbl .t { min-width:34px; padding:0 7px; border-radius:999px; font-size:13px; font-weight:900; background:rgba(0,0,0,.55); border:2px solid #ddd; }
  .lbl .g { display:flex; align-items:center; gap:3px; font-size:9.5px; font-weight:800; padding:1px 5px 1px 1px; border-radius:999px; background:rgba(0,0,0,.5); }
  .lbl.big .n { font-size:13px; color:#ffe27a; }
  .lbl.big .t { font-size:16px; }
  .lbl.crisis .t { animation:pulse .6s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.2); box-shadow:0 0 14px var(--gold); } }
  .port { position:absolute; transform:translate(-50%,-50%); font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.45); border-bottom:2px solid var(--c); white-space:nowrap; text-shadow:var(--sh); }
  .land { position:absolute; transform:translate(-50%,-50%); font-family:Cinzel,serif; font-weight:900; font-size:14px; letter-spacing:.22em; opacity:.85; text-shadow:0 0 6px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.6); white-space:nowrap; }
  .flt { position:absolute; transform:translate(-50%,-150%); display:flex; align-items:center; gap:3px; font-size:10.5px; font-weight:900; padding:1px 6px 1px 1px; border-radius:999px; background:rgba(0,0,0,.6); border:1.5px solid var(--c); white-space:nowrap; text-shadow:var(--sh); }
  .flt.gold { border-color:var(--gold); background:rgba(70,45,0,.8); font-size:12px; }
  .flt.anon { padding:1px 6px; }
  .flt.hero { transform:translate(-50%,-190%); font-size:14px; padding:2px 10px 2px 2px; border:2px solid var(--h); background:linear-gradient(90deg,rgba(60,40,0,.92),rgba(20,10,0,.85)); box-shadow:0 0 16px var(--h); }
  .flt.hero .hn { font-family:Cinzel,serif; letter-spacing:.06em; color:var(--h); }

  #hud { position:fixed; top:0; left:0; right:0; padding:10px 10px 0; pointer-events:none; }
  #vs { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:stretch; }
  .side { padding:6px 9px; border-radius:10px; background:var(--panel); border-top:3px solid var(--c); }
  .side.r { text-align:right; }
  .side b { display:block; font-size:13px; font-weight:900; letter-spacing:.06em; color:var(--c); text-shadow:var(--sh); }
  .side .s { font-size:11px; font-weight:700; opacity:.9; }
  .side .pts { font-size:22px; font-weight:900; line-height:1.05; }
  #mid { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 8px; border-radius:10px; background:var(--panel); }
  #timer { font-weight:900; font-size:20px; font-variant-numeric:tabular-nums; }
  #round { font-size:9.5px; font-weight:800; opacity:.75; letter-spacing:.08em; }
  #tug { position:relative; height:10px; margin-top:6px; border-radius:999px; overflow:hidden; background:var(--tr); box-shadow:0 1px 4px rgba(0,0,0,.4); }
  #tugGr { position:absolute; left:0; top:0; bottom:0; width:50%; background:var(--gr); transition:width .6s; }
  #tug::after { content:''; position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; background:#fff; }
  #peace { display:flex; align-items:center; gap:7px; margin-top:6px; padding:5px 9px; border-radius:10px; background:rgba(30,30,20,.62); }
  #peace .dove { font-size:20px; filter:drop-shadow(0 0 6px rgba(255,255,255,.6)); }
  #peace .txt { font-size:10.5px; font-weight:800; white-space:nowrap; }
  #peace .txt small { display:block; font-size:9.5px; opacity:.8; font-weight:700; }
  #peaceBar { flex:1; height:9px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; }
  #peaceFill { height:100%; width:0; background:linear-gradient(90deg,#9fd8ff,#fff,#ffe9a8); transition:width .5s; box-shadow:0 0 10px #fff; }
  #peacePct { font-weight:900; font-size:13px; min-width:38px; text-align:right; }
  #heroes { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .hc { display:flex; align-items:center; gap:6px; padding:3px 8px 3px 3px; border-radius:10px; background:linear-gradient(90deg,rgba(60,40,0,.75),rgba(4,22,38,.66)); border:1px solid rgba(255,213,74,.45); }
  .hc.on { border-color:var(--h); box-shadow:0 0 12px var(--h); animation:pulse2 .6s infinite alternate; }
  .hc .hn { font-family:Cinzel,serif; font-weight:900; font-size:12px; letter-spacing:.05em; color:var(--h); line-height:1; }
  .hc .hs { font-size:9px; font-weight:800; opacity:.85; }
  .hc .bars { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .hb { position:relative; height:5px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; }
  .hb i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .4s; }
  #goal { display:flex; align-items:center; gap:7px; margin-top:6px; padding:3px 9px; border-radius:10px; background:rgba(60,40,0,.62); font-size:10.5px; font-weight:800; }
  #goalBar { flex:1; height:7px; border-radius:99px; background:rgba(255,255,255,.15); overflow:hidden; }
  #goalFill { height:100%; width:0; background:linear-gradient(90deg,#ffb300,#ffe27a); transition:width .5s; }
  #goalTxt { font-variant-numeric:tabular-nums; }
  .hc .master { display:flex; align-items:center; gap:3px; font-size:8.5px; font-weight:800; opacity:.9; white-space:nowrap; overflow:hidden; }
  #cease { display:none; margin-top:6px; text-align:center; font-size:12px; font-weight:900; padding:5px; border-radius:10px; background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(200,230,255,.85)); color:#06263d; }
  #cease.on { display:block; }
  #tap { position:fixed; right:8px; top:262px; display:none; flex-direction:column; gap:5px; z-index:5; }
  #tap button { font:800 11px Inter,sans-serif; color:#fff; background:rgba(3,20,35,.85); border:1.5px solid var(--c,#fff); border-radius:10px; padding:6px 8px; cursor:pointer; text-align:left; }
  #tap button:active { transform:scale(.95); }
  #tap button:focus-visible { outline:2px solid var(--gold); }
  #crisis { display:none; margin-top:6px; text-align:center; font-size:12px; font-weight:900; padding:5px; border-radius:10px; background:linear-gradient(90deg,rgba(255,170,0,.85),rgba(255,90,0,.85)); animation:pulse2 .7s infinite alternate; }
  #crisis.on { display:block; }
  @keyframes pulse2 { to { filter:brightness(1.25); } }

  #feed { position:fixed; left:8px; bottom:calc(166px + var(--bi)); width:min(66vw,350px); display:flex; flex-direction:column-reverse; gap:4px; pointer-events:none; }
  .ev { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:3px 9px 3px 3px; border-radius:999px; background:var(--panel); border-left:3px solid var(--c,#fff); text-shadow:0 1px 2px rgba(0,0,0,.6); animation:in .25s ease-out; }
  .ev.noav { padding-left:9px; }
  .ev.big { background:rgba(70,45,0,.78); border-left-color:var(--gold); }
  .ev.peace { background:rgba(60,60,50,.75); border-left-color:#fff; }
  .ev.hero { background:linear-gradient(90deg,rgba(90,60,0,.9),rgba(40,25,0,.8)); border-left-color:var(--gold); font-weight:900; }
  @keyframes in { from { transform:translateX(-24px); opacity:0; } }

  #board { position:fixed; left:8px; right:8px; bottom:calc(66px + var(--bi)); display:grid; grid-template-columns:1fr 1fr; gap:6px; pointer-events:none; }
  .col { padding:5px 6px; border-radius:10px; background:var(--panel); border-top:3px solid var(--c); min-height:30px; }
  .col h4 { font-size:9.5px; letter-spacing:.1em; opacity:.85; margin:0 0 3px 3px; }
  .pl { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:800; margin-bottom:1px; line-height:1.1; }
  .pl .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl .rk { font-size:9px; opacity:.8; font-weight:700; display:block; }
  .pl .sc { font-variant-numeric:tabular-nums; }
  .pl .medal { width:14px; text-align:center; }

  #help { position:fixed; left:6px; right:6px; bottom:calc(8px + var(--bi)); pointer-events:none; }
  #help .set { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; animation:fade .5s; }
  #help .set[hidden] { display:none; }
  #help .set.gifts span { background:rgba(70,45,0,.82); border:1px solid rgba(255,213,74,.5); }
  #help span { font-size:10px; font-weight:800; padding:4px 8px; border-radius:999px; background:rgba(3,20,35,.75); }

  #showcase { position:fixed; left:50%; top:33%; transform:translate(-50%,-50%) scale(.6); opacity:0; display:flex; align-items:center; gap:12px; padding:10px 18px 10px 10px; border-radius:999px; background:linear-gradient(90deg,rgba(80,50,0,.92),rgba(40,25,0,.92)); border:2px solid var(--gold); box-shadow:0 0 30px rgba(255,200,60,.5); transition:transform .3s cubic-bezier(.2,1.6,.4,1), opacity .25s; pointer-events:none; max-width:94vw; }
  #showcase.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #showcase .who { font-size:17px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56vw; }
  #showcase .what { font-size:12.5px; font-weight:800; color:#ffe27a; }
  #banner { position:fixed; left:50%; top:44%; transform:translate(-50%,-50%) scale(.8); width:94vw; text-align:center; font-family:Cinzel,serif; font-weight:900; font-size:clamp(18px,5.6vw,36px); text-shadow:0 4px 16px rgba(0,0,0,.85); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  #banner.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #banner small { display:block; font-family:Inter,sans-serif; font-size:.5em; letter-spacing:.02em; }

  #finale { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:9px; padding:20px; text-align:center; background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.2), rgba(0,10,25,.82)); }
  body.fin #labels, body.fin #feed { opacity:.15; transition:opacity 1s; }
  body.fin #tap { display:none !important; }
  #finale.on { display:flex; animation:fade 1s ease-out; }
  @keyframes fade { from { opacity:0; } }
  #finale .big { font-family:Cinzel,serif; font-size:clamp(34px,11vw,70px); font-weight:900; line-height:1.05; text-shadow:0 0 30px rgba(255,255,255,.6), 0 6px 20px rgba(0,0,0,.6); }
  #finale .langs { font-size:19px; font-weight:800; letter-spacing:.05em; }
  #finale .flags { font-size:42px; }
  #finale .card { max-width:94vw; display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:999px; background:rgba(0,0,0,.45); border:2px solid var(--c,#fff); font-weight:800; font-size:14px; text-align:left; }
  #finale .card small { display:block; font-size:11px; opacity:.8; }
  #finale .heroes { border-color:var(--gold); background:rgba(70,45,0,.6); }
  #finale .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #finale .meta { font-size:13px; font-weight:700; opacity:.9; }

  #langBtn { position:fixed; right:8px; top:206px; display:flex; gap:2px; padding:2px; border-radius:8px; background:rgba(3,20,35,.8); z-index:5; }
  #langBtn button { font:800 11px Inter,sans-serif; color:#fff; background:transparent; border:0; padding:4px 7px; border-radius:6px; cursor:pointer; }
  #langBtn button.on { background:#fff; color:#06263d; }
  #langBtn .sep { width:1px; background:rgba(255,255,255,.25); margin:2px 2px; }
  #langBtn button:focus-visible { outline:2px solid var(--gold); }
  #demo { position:fixed; right:8px; top:232px; font-size:10px; font-weight:900; letter-spacing:.1em; padding:3px 7px; border-radius:6px; background:#b3261e; display:none; }
  #status { position:fixed; left:8px; top:210px; font-size:10px; opacity:.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="hud">
  <div id="vs">
    <div class="side" style="--c:var(--gr)"><b id="nmGr"></b><div class="pts" id="ptsGr">0</div><div class="s" id="infGr"></div></div>
    <div id="mid"><div id="timer">6:00</div><div id="round"></div></div>
    <div class="side r" style="--c:var(--tr)"><b id="nmTr"></b><div class="pts" id="ptsTr">0</div><div class="s" id="infTr"></div></div>
  </div>
  <div id="tug"><div id="tugGr"></div></div>
  <div id="peace"><span class="dove">🕊</span><div class="txt"><span data-i="peace"></span><small data-i="peaceHint"></small></div><div id="peaceBar"><div id="peaceFill"></div></div><span id="peacePct">0%</span></div>
  <div id="goal"><span>🎯 <span data-i="goal"></span></span><div id="goalBar"><div id="goalFill"></div></div><span id="goalTxt"></span></div>
  <div id="heroes"></div>
  <div id="crisis" data-i="crisisBar"></div>
  <div id="cease" data-i="ceaseBar"></div>
</div>

<div id="feed"></div>
<div id="board">
  <div class="col" style="--c:var(--gr)"><h4>🇬🇷 <span data-i="topCaps"></span></h4><div id="lbGr"></div></div>
  <div class="col" style="--c:var(--tr)"><h4>🇹🇷 <span data-i="topCaps"></span></h4><div id="lbTr"></div></div>
</div>
<div id="help">
  <div class="set" id="helpA"><span data-i="helpJoin"></span><span data-i="helpTarget"></span><span data-i="helpLike"></span><span data-i="helpGift"></span><span data-i="helpHero"></span><span data-i="helpPeace"></span></div>
  <div class="set gifts" id="helpB" hidden><span data-i="giftMenu1"></span><span data-i="giftMenu2"></span><span id="giftMenu3"></span><span data-i="giftMenu4"></span><span data-i="giftMenu5"></span></div>
</div>

<div id="showcase"><span id="scAv"></span><div><div class="who" id="scWho"></div><div class="what" id="scWhat"></div></div></div>
<div id="banner"></div>
<div id="finale"></div>
<div id="langBtn" role="group" aria-label="Dil / Sprache"><button type="button" id="btnTr">🇹🇷 TR</button><button type="button" id="btnDe">🇩🇪 DE</button><span class="sep"></span><button type="button" id="btnSnd" aria-label="Ton">🔊</button></div>
<div id="tap">
  <button type="button" data-tap="q" style="--c:var(--gr)">🎁 🇬🇷</button>
  <button type="button" data-tap="w" style="--c:var(--tr)">🎁 🇹🇷</button>
  <button type="button" data-tap="u" style="--c:#ffd54a">⚔ UĞURCAN</button>
  <button type="button" data-tap="c" style="--c:#7ef0ff">⚔ CEM</button>
  <button type="button" data-tap="k" style="--c:#ffd54a">👑 99 💎</button>
  <button type="button" data-tap="f" style="--c:#fff">🕊 <span data-i="tapPeace"></span></button>
  <button type="button" data-tap="p" style="--c:#fff">🏁 <span data-i="tapFinale"></span></button>
</div>
<div id="demo" data-i="demo"></div>
<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
//  KONFIGURATION / AYARLAR
// =====================================================================
const params = new URLSearchParams(location.search);
const CONFIG = {
  roundSeconds: +(params.get('round') || 360), // Rundendauer, danach immer Friedensgipfel
  peaceGoal: +(params.get('peace') || 650),    // so viele Friedenspunkte beenden die Runde früher
  peacePerComment: 5, peacePerLike: 0.08, peacePerSecond: 0.4,
  likeTroops: 1, commentTroops: 3, followTroops: 25, shareTroops: 15,
  troopsPerDiamond: 5,    // Rose = 1 Diamant = 5 Soldaten
  launchEvery: 3.0, launchShare: 0.65, minLaunch: 8,
  crisisEvery: 75, crisisLength: 20,
  finaleSeconds: 16,
  heroCharge: 25,         // Ruf-Punkte, bis ein Held erscheint (Kommentar = 1, Geschenk = 1 pro Diamant)
  heroTroops: 140, heroPower: 2, heroHops: 3, heroCooldown: 40,
  stormLength: 10, stormSlow: 0.45, shieldLength: 20,   // Fähigkeiten der Helden
  patronDiamonds: 99,     // so viele Diamanten in einer Runde → eigenes Legendenschiff (fester Wert, kein Zufall)
  giftGoal: +(params.get('goal') || 500), // Diamanten-Ziel pro Runde → Feuerwerk + Dank an alle Schenkenden
  ceasefireNeed: 3, ceasefireLength: 8, ceasefireCooldown: 45, // „barış“ von beiden Seiten → Waffenruhe
  bottomInset: +(params.get('bottom') || 0), // Pixel Abstand unten, falls der TikTok-Chat das Spiel verdeckt
  sound: params.get('sound') !== '0',
  defaultLang: 'tr',      // 'tr' oder 'de'
  wsUrl: params.get('ws') || `ws://${location.hostname || 'localhost'}:${params.get('port') || 8787}`,
  // Auf einer Webseite (z. B. GitHub Pages) gibt es keinen lokalen server.js: dann direkt Demo-Modus
  forceDemo: params.get('demo') === '1' || (!params.get('ws') && location.protocol === 'https:'),
  allowDemo: params.get('demo') !== '0', // ?demo=0: niemals simulierte Zuschauer (empfohlen für die OBS-Quelle im echten Stream)
  showLangButton: params.get('ui') !== '0',
};

// Die zwei Helden. side: null = beide Seiten können sie rufen; 0 = nur Griechenland, 1 = nur Türkei
const HEROES = [
  { id:'ugurcan', name:'UĞURCAN', keys:['ugurcan'], side:null, css:'#ffd54a', cape:'#ff3b3b', ability:'storm' },  // Sturm: Gegner langsamer
  { id:'cem',     name:'CEM',     keys:['cem'],     side:null, css:'#7ef0ff', cape:'#2f7bff', ability:'shield' }, // Schild: eine Insel geschützt
];

// =====================================================================
//  SPRACHE / DİL
// =====================================================================
const I18N = {
  tr: {
    gr:'YUNANİSTAN', tr:'TÜRKİYE', grShort:'Yunanistan', trShort:'Türkiye',
    round:'TUR {n}', peace:'BARIŞ', peaceHint:'yaz: barış · frieden · ειρήνη',
    crisisBar:'⚡ KIBRIS KRİZİ! Tüm filolar Kıbrıs’a, çift asker! ⚡',
    helpJoin:'💬 1 = 🇬🇷 · 2 = 🇹🇷', helpTarget:'💬 Ada adı = hedef', helpLike:'❤️ Beğeni = asker',
    helpGift:'🎁 Hediye = senin adınla filo', helpHero:'⚔ „ugurcan“ / „cem“ = kahraman çağır', helpPeace:'🕊 „barış“ = barış çubuğu',
    topCaps:'EN İYİ KAPTANLAR', joinHint:'Katılmak için {n} yaz!', demo:'DEMO MODU',
    ranks:['Acemi Er','Tayfa','Lostromo','Kaptan','Amiral','Efsane'],
    rankUp:'{icon} {nick} artık {rank}!',
    roundStart:'⚓ {n}. tur: 🇬🇷 için 1, 🇹🇷 için 2 yaz!',
    seaBattle:'💥 Deniz savaşı! {a}, {b} filosunu batırdı',
    capture:'{side}<br>{isl} adasını fethetti!', governor:'👑 {nick} artık vali',
    captureFeedWho:'🏴 {nick}, {flag} için {isl} adasını aldı', captureFeed:'🏴 {flag} {isl} adasını aldı',
    crisisBanner:'⚡ KIBRIS KRİZİ! ⚡<small>Tüm filolar Kıbrıs’a!</small>',
    whyPeace:'İzleyiciler barışı seçti!', whyAll:'{flag} {side} tüm adaları tutuyor ve barışa el uzatıyor.', whyTime:'Süre doldu: müzakere masasına!',
    finaleBig:'BARIŞ<br>KAZANDI', finaleLangs:'Barış · Ειρήνη · Frieden',
    peacemaker:'🕊 Turun barış elçisi ({n} barış puanı)', bravest:'{flag} en cesur kaptan · {n} P.',
    islandsEnd:'Son durumda adalar: 🇬🇷 {a} · 🇹🇷 {b}', cyprusFree:' · Kıbrıs özgür kaldı',

  function tone(freq, dur, type = 'sine', vol = 0.2, when = 0, slide = 0) {
    if (!ok()) return;
    const t0 = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();

    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);

const doves = [];
const doveBody = new THREE.SphereGeometry(1, 10, 8), wingGeo = new THREE.PlaneGeometry(1, 0.5); wingGeo.translate(0.5, 0, 0);
const doveMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.6, side:THREE.DoubleSide, emissive:0x333333 });
function spawnDove(i, ttl, around) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(doveBody, doveMat); b.scale.set(0.18, 0.15, 0.36); g.add(b);
  const h = new THREE.Mesh(doveBody, doveMat); h.scale.setScalar(0.11); h.position.set(0, 0.08, 0.32); g.add(h);
  const wl = new THREE.Mesh(wingGeo, doveMat), wr = new THREE.Mesh(wingGeo, doveMat); wr.rotation.y = Math.PI; g.add(wl, wr);
  const a = rnd() * Math.PI * 2, r = 28;
  g.position.set(Math.cos(a) * r, 3 + rnd() * 4, Math.sin(a) * r);
  const target = around ? around.clone().add(new THREE.Vector3((rnd() - .5) * 6, 3 + rnd() * 2, (rnd() - .5) * 4)) : new THREE.Vector3((rnd() - .5) * 20, 3 + rnd() * 3, (rnd() - .5) * 26);
  if (around) g.position.set(around.x + (rnd() - .5) * 10, 6, around.z - 8);
  g.scale.setScalar(1.2 + rnd() * 0.8); scene.add(g);
  doves.push({ g, wl, wr, target, ph:rnd() * 6, sp:4 + rnd() * 3, delay:i * 0.12, ttl, around });
}
function updateDoves(dt, tt) {
  for (let i = doves.length - 1; i >= 0; i--) {
    const d = doves[i];
    if (d.ttl != null && (d.ttl -= dt) <= 0) { scene.remove(d.g); doves.splice(i, 1); continue; }
    if ((d.delay -= dt) > 0) continue;
    const dir = tA.subVectors(d.target, d.g.position);
    if (dir.length() < 1) { if (d.around) d.target.copy(d.around).add(new THREE.Vector3((rnd() - .5) * 6, 3 + rnd() * 2, (rnd() - .5) * 4)); else d.target.set((rnd() - .5) * 26, 3 + rnd() * 4, (rnd() - .5) * 30); }
    dir.normalize();
    d.g.position.addScaledVector(dir, d.sp * dt);
    d.g.rotation.y = Math.atan2(dir.x, dir.z);
    const flap = Math.sin(tt * 12 + d.ph) * 0.8;

}

function handleEvent(e) {
  if (roundOver && e.type !== 'chat') return;
  const u = getUser(e);
  switch (e.type) {
    case 'chat': {
      const raw = e.comment || '', toks = tokenize(raw), rtoks = rawTokens(raw);
      const isPeace = raw.includes('🕊') || raw.includes('☮') || toks.some(k => PEACE_WORDS.includes(k));
      if (isPeace) { peace += CONFIG.peacePerComment; u.peace += CONFIG.peacePerComment; addPts(u, 2); if (u.peace % 25 < CONFIG.peacePerComment) feed(t('wishPeace', { nick:u.nick }), '#fff', u, 'peace'); }
      if (roundOver) return;
      const joinGr = raw.includes('🇬🇷') || toks.some(k => SIDES[0].keys.includes(k));
      const joinTr = raw.includes('🇹🇷') || toks.some(k => SIDES[1].keys.includes(k));
      const join = joinGr && !joinTr ? SIDES[0] : joinTr && !joinGr ? SIDES[1] : null;
      if (join && join.id !== u.side) { u.side = join.id; feed(t('joined', { nick:u.nick, flag:join.flag, side:sideShort(join) }), join.css, u); }
      const s = ensureSide(u);
      if (isPeace) {
        peaceWin[s.id].push(now);
        for (const w of peaceWin) while (w.length && now - w[0] > 10) w.shift();
        if (ceaseT <= 0 && ceaseCool <= 0 && peaceWin[0].length >= CONFIG.ceasefireNeed && peaceWin[1].length >= CONFIG.ceasefireNeed) startCeasefire();
      }
      const hero = HEROES.find(h => toks.some(k => h.keys.includes(k)));
      if (hero && now > u.heroT) { u.heroT = now + 2; chargeHero(hero, s, u, 1); }
      const isl = islands.find(i => toks.some(k => i.aliases.includes(k)) || rtoks.some(k => i.strict.includes(k)));
      if (isl && isl.owner !== s.id && isl !== s.target && crisisOn <= 0 && now > s.voteT) {
        s.target = isl; s.voteT = now + 4;
        feed(t('target', { nick:u.nick, flag:s.flag, isl:islandName(isl) }), s.css, u);
      }
      s.reserve += CONFIG.commentTroops; addPts(u, 1);
      break;
    }
    case 'like': {
      const s = ensureSide(u), n = Math.max(1, e.count | 0);
      s.reserve += n * CONFIG.likeTroops; addPts(u, n);
      peace += n * CONFIG.peacePerLike;
      u.likeWin.push([now, n]); u.likeWin = u.likeWin.filter(x => now - x[0] < 6);
      const combo = u.likeWin.reduce((a, x) => a + x[1], 0);
      if (combo >= 40 && !u.comboShown) { u.comboShown = true; feed(t('combo', { nick:u.nick, n:combo }), s.css, u, 'big'); setTimeout(() => u.comboShown = false, 8000); }
      const fr = front(s); if (fr) { const p = fr.pos.clone(); p.y = 1.2; emit(p, s.color, Math.min(n, 6), 1, 0.7, 2.5); }
      break;
    }
    case 'gift': {
      const s = ensureSide(u), dia = Math.max(1, e.diamonds || 1), cnt = Math.max(1, e.count || 1), troops = dia * cnt * CONFIG.troopsPerDiamond;
      addPts(u, troops); SFX.gift();
      u.roundDia = (u.roundDia || 0) + dia * cnt; roundDia += dia * cnt;
      const tg = pickTarget(s), fr = front(s);
      if (tg && fr && u.roundDia >= CONFIG.patronDiamonds && !u.patronDone) {
        u.patronDone = true;
        launchFleet(s, fr, tg, troops, u, true, null, u); // trifft doppelt so hart (siehe arrive)
        banner(t('patron', { nick:esc(u.nick), flag:s.flag })); feed(t('patronFeed', { nick:u.nick, flag:s.flag }), '#ffd54a', u, 'hero');
        showcase(u, `👑 ${u.nick}`, t('patronShow', { n:troops, flag:s.flag })); SFX.fanfare(); focusOn(fr.pos, 2.5);
        if (!goalDone && roundDia >= CONFIG.giftGoal) goalReached();
        const hero0 = u.heroPick && heroFor(u.heroPick, s.id) ? u.heroPick : null;
        if (hero0) chargeHero(hero0, s, u, dia * cnt);
        break;
      }
      if (tg && fr) launchFleet(s, fr, tg, troops, u, true);
      if (!goalDone && roundDia >= CONFIG.giftGoal) goalReached();
      const gift = (e.giftName || t('giftDefault')) + (cnt > 1 ? ' x' + cnt : '');
      showcase(u, `${rankLabel(rankOf(u))} · ${u.nick}`, t('giftShow', { gift, n:troops, flag:s.flag }));
      feed(t('giftFeed', { nick:u.nick, gift, n:troops }), s.css, u, 'big');
      if (troops >= 150 && tg) focusOn(tg.pos, 2);
      // Geschenke laden auch den zuletzt gerufenen (oder den stärksten) Helden auf
      const hero = u.heroPick && heroFor(u.heroPick, s.id) ? u.heroPick : HEROES.filter(h => heroFor(h, s.id)).sort((a, b) => b.charge[s.id] - a.charge[s.id])[0];
      if (hero) chargeHero(hero, s, u, dia * cnt);
      break;
    }
    case 'follow': { const s = ensureSide(u); s.reserve += CONFIG.followTroops; addPts(u, 10); feed(t('follow', { nick:u.nick, flag:s.flag, n:CONFIG.followTroops }), s.css, u); break; }
    case 'share':  { const s = ensureSide(u); s.reserve += CONFIG.shareTroops;  addPts(u, 5);  feed(t('share', { nick:u.nick, flag:s.flag, n:CONFIG.shareTroops }), s.css, u); break; }
  }
}

    if (r < 0.55) handleEvent({ fake:true, type:'like', user, nick:user, count:1 + Math.floor(rnd() * 12) });
    else if (r < 0.86) handleEvent({ fake:true, type:'chat', user, nick:user, comment:FAKE_CHAT[Math.floor(rnd() * FAKE_CHAT.length)] });
    else if (r < 0.89) { const g = FAKE_GIFTS[Math.floor(rnd() * (rnd() < 0.97 ? 5 : 6))]; handleEvent({ fake:true, type:'gift', user, nick:user, giftName:g[0], diamonds:g[1], count:1 + Math.floor(rnd() * 3) }); }
    else if (r < 0.894) handleEvent({ fake:true, type:'follow', user, nick:user });
    else if (r < 0.897) handleEvent({ fake:true, type:'share', user, nick:user });
  }
}
// Testtasten: Q/W = Geschenk 🇬🇷/🇹🇷 · U/C = UĞURCAN/CEM sofort (U für 🇹🇷, C für 🇬🇷) · F = Frieden · P = Finale · L = Sprache · D = Demo
addEventListener('keydown', ev => testKey(ev.key.toLowerCase()));
tapEl.addEventListener('click', ev => { const b = ev.target.closest('[data-tap]'); if (b) testKey(b.dataset.tap); });
function testKey(k) {
  const i = 'qw'.indexOf(k);
  if (i >= 0) { const user = 'tester_' + i; const u = getUser({ user, nick:'Test ' + SIDES[i].flag }); u.side = i; handleEvent({ type:'gift', user, nick:u.nick, giftName:'Test-Galaxy', diamonds:30, count:1 }); }
  if (k === 'u' || k === 'c') {
    const hero = HEROES[k === 'u' ? 0 : 1], sid = hero.side ?? (k === 'u' ? 1 : 0), u = getUser({ user:'tester_h' + sid, nick:'Test ' + SIDES[sid].flag });
    u.side = sid; hero.rest = 0; hero.active = null; hero.charge[sid] = CONFIG.heroCharge - 1; chargeHero(hero, SIDES[sid], u, 1);
  }
  if (k === 'k') { const sid = rnd() < 0.5 ? 0 : 1, u = getUser({ user:'tester_k' + sid, nick:'Test 👑 ' + SIDES[sid].flag }); u.side = sid; handleEvent({ type:'gift', user:u.id, nick:u.nick, giftName:'Test 99', diamonds:99, count:1 }); }
  if (k === 'f') for (let j = 0; j < 6; j++) { const sid = j % 2, u = getUser({ user:'tester_f' + j, nick:'🕊 ' + SIDES[sid].flag }); u.side = sid; handleEvent({ type:'chat', user:u.id, nick:u.nick, comment:j % 2 ? 'barış 🕊' : 'ειρήνη 🕊' }); }
  if (k === 'p') peace = CONFIG.peaceGoal;
  if (k === 'l') setLang(lang === 'tr' ? 'de' : 'tr');
  if (k === 'd') setDemo(!demo);
  if (k === 'm') { SFX.toggle(); syncSnd(); }
}

// =====================================================================
//  LOOP
// =====================================================================
function updateWater(tt) { const p = waterGeo.attributes.position.array; for (let i = 0; i < p.length; i += 3) p[i + 1] = waveH(waterBase[i], waterBase[i + 2], tt); waterGeo.attributes.position.needsUpdate = true; }
function waveFlag(o, tt) { const a = o.flag.geometry.attributes.position, b = o.flagBase; for (let i = 0; i < a.count; i++) a.setZ(i, Math.sin(b[i * 3] * 6 - tt * 6 + o.ph) * 0.12 * b[i * 3]); a.needsUpdate = true; }
function updateFlags(tt, dt) {
  for (const o of islands) { waveFlag(o, tt); if (o.pulse > 0) { o.pulse = Math.max(0, o.pulse - dt); const s = 1 + o.pulse * 0.3; o.ring.scale.set(o.rx * s, o.rz * s, 1); } }
  ports.forEach(p => waveFlag(p, tt));
  if (crisisOn > 0) { CYPRUS.ring.material.opacity = 0.5 + Math.sin(tt * 8) * 0.4; if (rnd() < 0.3) emit(new THREE.Vector3(CYPRUS.pos.x + (rnd() - .5) * 5, 0.5, CYPRUS.pos.z + (rnd() - .5) * 2.5), C_GOLD, 2, 0.5, 1, 2, 0.5, 0.5); }
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camDist = Math.max(23 / tanV, 19.2 / (tanV * camera.aspect));
  scene.fog.near = camDist + 20; scene.fog.far = camDist + 150;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const v = new THREE.Vector3();
function place(el, x, y, z) {
  v.set(x, y, z).project(camera);
  el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
}
function updateLabels() {
  for (const o of islands) { place(o.el, o.pos.x, o.top, o.pos.z); o.elT.textContent = Math.floor(o.troops); }
  for (const p of ports) { place(p.el, p.pos.x, 0.6, p.pos.z + 0.75); p.el.textContent = `⚓ ${p.names[lang]} ${Math.floor(p.troops)}`; }
  for (const l of landLabels) { place(l.el, l.pos.x, 0.6, l.pos.z); const w = l.el.offsetWidth / 2 + 6; l.el.style.left = THREE.MathUtils.clamp(parseFloat(l.el.style.left), w, innerWidth - w) + 'px'; }
  for (const f of fleets) place(f.el, f.group.position.x, f.hero ? 2.6 : 1.1, f.group.position.z);
}

const clock = new THREE.Clock(); let hudAcc = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), tt = clock.elapsedTime; now = tt;
  if (demo) demoTick(dt);
  tick(dt);
  updateWater(tt); updateFlags(tt, dt); updateFleets(dt, tt); updateParticles(dt); updateDoves(dt, tt);
  clouds.forEach(c => { c.g.position.x += c.v * dt * (stormT > 0 ? 4 : 1); if (c.g.position.x > 35) c.g.position.x = -35; });
  hemi.intensity += ((stormT > 0 ? 0.4 : 0.75) - hemi.intensity) * Math.min(1, dt * 2);
  sun.intensity += ((stormT > 0 ? 0.55 : 1.3) - sun.intensity) * Math.min(1, dt * 2);
  if (stormT > 0) {
    for (let k = 0; k < 12; k++) { const p = new THREE.Vector3((rnd() - .5) * 40, 9, (rnd() - .5) * 44); emit(p, C_RAIN, 1, 0, 0.8, -12, 0, 6); }
    if (rnd() < 0.012) { sun.intensity = 4; SFX.thunder(); }
  }
  if (shieldT > 0) dome.material.opacity = 0.16 + Math.sin(tt * 4) * 0.06;
  if (!roundOver && rnd() < 0.002) SFX.gull();
  let goal = camHome, z = 1;
  if (focus) { focus.t -= dt; goal = focus.pos; z = roundOver ? 0.92 : 0.72; if (focus.t <= 0) focus = null; }
  camTarget.lerp(goal, Math.min(1, dt * 2)); zoom += (z - zoom) * Math.min(1, dt * 2);
  shake *= 0.9;
  const sway = new THREE.Vector3(Math.sin(tt * 0.13) * 0.5, 0, Math.cos(tt * 0.11) * 0.35);
  camera.position.copy(camTarget).add(sway).addScaledVector(camDir, camDist * zoom);
  camera.position.x += (rnd() - .5) * shake; camera.position.y += (rnd() - .5) * shake;
  camera.lookAt(tB.copy(camTarget).add(sway));
  renderer.render(scene, camera);
  updateLabels();
  hudAcc += dt; if (hudAcc > 0.25) { hudAcc = 0; updateHud(); }
  requestAnimationFrame(frame);
}
HEROES.forEach(h => { h.charge = [0, 0]; h.active = null; h.rest = 0; });
setLive(false);
applyLang();
resetRound(); connect(); frame();
</script>
